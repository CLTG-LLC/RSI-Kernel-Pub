name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Official uv action: https://docs.astral.sh/uv/guides/integration/github/
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 (SHA pin per vendor README)
      # Java host example (issue #7): https://github.com/actions/setup-java/releases/tag/v6.2.0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0 (SHA pin)
        with:
          distribution: temurin
          java-version: '21'
      - run: uv sync --locked
      # ubuntu-latest ships Docker, so the E0 isolation tests run here.
      - run: uv run pytest -q
