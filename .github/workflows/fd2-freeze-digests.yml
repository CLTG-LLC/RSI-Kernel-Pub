{
  "name": "fd2-freeze-digests",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "PYTHONPATH": "${{ github.workspace }}/src"
  },
  "jobs": {
    "freeze": {
      "runs-on": "ubuntu-26.04",
      "timeout-minutes": 60,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        },
        {
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install hash-locked dataset tools",
          "run": "python -m pip install --require-hashes -r tools/fd2/harness-requirements.lock"
        },
        {
          "name": "Resolve linux/amd64 digests from registry metadata (no pulls)",
          "run": "cd tools/fd2 && python image_digests.py --sidecar ../../docs/prereg-fd2-items.json --output ../../image-digests.json\nsha256sum ../../image-digests.json"
        },
        {
          "id": "publication_scan",
          "name": "Fail-closed scan of the exact artifact file",
          "run": "python -m rsi_kernel.publication image-digests.json"
        },
        {
          "name": "Upload the frozen mapping",
          "if": "steps.publication_scan.outcome == 'success'",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "fd2-image-digests",
            "path": "image-digests.json",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
